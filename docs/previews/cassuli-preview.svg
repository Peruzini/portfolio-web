  <rect x="1122" y="23" width="126" height="46" rx="23" fill="#329c67"/>
  <text x="1142" y="52" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">Consultoria</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="188" font-size="17" font-weight="700" fill="#e0bc3e">CONHECIMENTO TÉCNICO. RESULTADOS REAIS.</text>
    <text x="70" y="267" font-size="51" font-weight="700" fill="#fff">Consultoria técnica para</text>
    <text x="70" y="330" font-size="43" font-weight="700" fill="#55c486">mineração, meio ambiente e geotecnologia.</text>
    <text x="70" y="392" font-size="22" fill="#eef2ef">Soluções especializadas para processos minerários, projetos de mina,</text>
