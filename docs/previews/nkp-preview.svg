    <text x="650" y="55">Sobre</text><text x="725" y="55">Atuação</text><text x="815" y="55">Diferenciais</text><text x="930" y="55">Método</text><text x="1010" y="55">Clientes</text><text x="1090" y="55">Contato</text>
  </g>
  <rect x="1160" y="22" width="92" height="48" rx="24" fill="#1aa7e8"/>
  <text x="1174" y="52" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">Orçamento</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="188" font-size="17" font-weight="700" fill="#26b2ef">CONSTRUÇÃO • INFRAESTRUTURA • SERVIÇOS OPERACIONAIS</text>
    <text x="70" y="268" font-size="54" font-weight="700" fill="#fff">Construção eficiente.</text>
    <text x="70" y="334" font-size="54" font-weight="700" fill="#25afea">Operação que não para.</text>
    <text x="70" y="395" font-size="22" fill="#edf5f9">Soluções integradas em obras civis, montagens industriais, infraestrutura</text>
    <text x="70" y="428" font-size="22" fill="#edf5f9">e serviços operacionais, com agilidade, segurança e rigor técnico.</text>

    <rect x="70" y="491" width="230" height="58" rx="29" fill="#1aa7e8" filter="url(#shadow)"/>
    <text x="96" y="527" font-size="17" font-weight="700" fill="#fff">Solicitar orçamento</text>
    <rect x="320" y="491" width="244" height="58" rx="29" fill="#071a2b" fill-opacity="0.72" stroke="#fff" stroke-width="2"/>
    <text x="346" y="527" font-size="17" font-weight="700" fill="#fff">Conheça as soluções</text>

    <g filter="url(#shadow)">
      <rect x="820" y="176" width="390" height="404" rx="24" fill="#061829" fill-opacity="0.93" stroke="#1aa7e8" stroke-width="2"/>
      <text x="855" y="225" font-size="16" font-weight="700" fill="#26b2ef">NKP OBRA FÁCIL</text>
      <text x="855" y="280" font-size="31" font-weight="700" fill="#fff">Um único parceiro para</text>
      <text x="855" y="321" font-size="31" font-weight="700" fill="#fff">diferentes frentes.</text>
      <text x="855" y="369" font-size="18" fill="#dce8ef">Capacidade operacional para projetos de</text>
      <text x="855" y="397" font-size="18" fill="#dce8ef">pequeno, médio e grande porte, do</text>
      <text x="855" y="425" font-size="18" fill="#dce8ef">fornecimento de insumos à execução.</text>
      <line x1="855" y1="467" x2="1170" y2="467" stroke="#1aa7e8" stroke-width="2"/>
      <text x="855" y="506" font-size="17" font-weight="700" fill="#fff">✓ Soluções de ponta a ponta</text>
      <text x="855" y="536" font-size="17" font-weight="700" fill="#fff">✓ Qualidade e transparência</text>
      <text x="855" y="566" font-size="17" font-weight="700" fill="#fff">✓ Agilidade e conformidade</text>
    </g>

    <rect x="70" y="612" width="286" height="42" rx="21" fill="#fff"/>
    <text x="90" y="639" font-size="15" font-weight="700" fill="#0a496e">CASE • WEBSITE INSTITUCIONAL</text>
