    <text x="82" y="30" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#fff">NKP</text>
    <text x="82" y="50" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1aa7e8">OBRA FÁCIL</text>
  </g>
