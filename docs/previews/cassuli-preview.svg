<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Preview visual — Cassuli Consultoria</title>
  <desc id="desc">Representação visual do website institucional da Cassuli Consultoria.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18261f"/>
      <stop offset="0.55" stop-color="#243a31"/>
      <stop offset="1" stop-color="#0f1915"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#625a4d"/>
      <stop offset="1" stop-color="#252723"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0 430 L250 350 L520 390 L780 320 L1040 385 L1280 305 L1280 720 L0 720 Z" fill="url(#ground)" opacity="0.92"/>
  <path d="M0 505 L250 440 L500 475 L780 420 L1020 470 L1280 405" fill="none" stroke="#9b8b72" stroke-width="18" opacity="0.28"/>
