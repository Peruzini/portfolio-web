<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Preview visual — NKP Obra Fácil</title>
  <desc id="desc">Representação visual do website institucional da NKP Obra Fácil.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="0.55" stop-color="#123b58"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7881"/>
      <stop offset="1" stop-color="#303941"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect y="445" width="1280" height="275" fill="url(#floor)" opacity="0.75"/>

  <g opacity="0.22" stroke="#8fb7cf" stroke-width="8" fill="none">
    <path d="M610 140 V520 M720 140 V520 M830 140 V520 M940 140 V520 M1050 140 V520 M1160 140 V520"/>
    <path d="M560 180 H1220 M560 275 H1220 M560 370 H1220"/>
    <path d="M570 520 L650 380 L730 520 L810 380 L890 520 L970 380 L1050 520 L1130 380 L1210 520"/>
  </g>

  <rect width="1280" height="92" fill="#061829"/>
