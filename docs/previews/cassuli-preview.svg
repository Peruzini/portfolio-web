  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243a31">
    <text x="720" y="55">Início</text><text x="793" y="55">Sobre</text><text x="865" y="55">Serviços</text><text x="958" y="55">Clientes</text><text x="1050" y="55">Contato</text>
